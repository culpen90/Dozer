name: Dozer validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate upstream tracking and release-tool regressions
        run: |
          python3 -m unittest discover -s Tests/RectangleReleaseTests -v
          python3 Scripts/rectangle_release.py verify
          python3 Scripts/update_notices.py --check
      - name: Test Dozer state and window geometry
        run: make test
      - name: Test scoped Accessibility state restoration
        run: make test-window-adjustment
      - name: Install project generator
        run: brew install xcodegen
      - name: Build universal Dozer
        run: make release
      - name: Package validated build
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Dozer.app build/artifacts/Dozer.zip
          shasum -a 256 build/artifacts/Dozer.zip > build/artifacts/Dozer.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dozer-universal
          path: build/artifacts/*
          retention-days: 14
