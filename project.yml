name: Dozer
options:
  usesTabs: false
  tabWidth: 4
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode's preview trampoline loads a separate dylib that cannot satisfy
    # hardened library validation with local ad-hoc signing. Dozer uses AppKit.
    ENABLE_DEBUG_DYLIB: NO
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Dozer:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    sources:
      - path: Dozer
        excludes:
          - XIB
          - Other/Generated
          - Other/bridging-header.h
          - Other/Info.plist
          - Other/Dozer.entitlements
      - path: DozerCore
    settings:
      base:
        INFOPLIST_FILE: Dozer/Other/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dozer/Other/Dozer.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mortennn.Dozer
        PRODUCT_NAME: Dozer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 34
        VERSIONING_SYSTEM: apple-generic
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Dozer:
    build:
      targets:
        Dozer: all
    run:
      config: Debug
    archive:
      config: Release
